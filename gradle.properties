kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native
# Xcode 16.2 is older than the Xcode version Kotlin 2.2.21 was tested against; builds work, so silence the advisory.
kotlin.apple.xcodeCompatibility.nowarn=true
# Kotlin 2.2's prebuilt platform caches reference symbols from newer Apple SDKs than Xcode 16.x ships, which
# breaks linking (e.g. undefined _CGBitmapContextCreateAdaptive). Without caches only the APIs actually used
# are linked. Safe to remove when building with Xcode 26+; debug iOS builds are faster with caches enabled.
kotlin.native.cacheKind=none
